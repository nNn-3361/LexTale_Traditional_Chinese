<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>繁體假字組字器</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@100..900&family=Noto+Serif+TC:wght@200..900&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: workbench — editor (sources → composed glyph on a 米字格) beside the item list; stacks on phones */
:root{
  --paper:#eef1ee; --sheet:#fbfcfb; --ink:#1b2321; --muted:#5d6966; --line:#cfd6d2;
  --zhu:#b8432f; --zhu-soft:#f3dcd5; --ok:#2f7a4f; --ok-soft:#d9eee1; --warn:#9a6a10; --warn-soft:#f5ead1;
  --f-ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-display:"Noto Serif TC","PMingLiU",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#131917; --sheet:#1b2220; --ink:#e4ebe8; --muted:#94a19d; --line:#2f3936;
  --zhu:#e2765f; --zhu-soft:#3a221c; --ok:#6cc391; --ok-soft:#1d3327; --warn:#e0b45a; --warn-soft:#352b17; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#131917; --sheet:#1b2220; --ink:#e4ebe8; --muted:#94a19d; --line:#2f3936;
  --zhu:#e2765f; --zhu-soft:#3a221c; --ok:#6cc391; --ok-soft:#1d3327; --warn:#e0b45a; --warn-soft:#352b17; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.55}
.wrap{max-width:1180px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 24px;margin-bottom:16px}
h1{font-family:var(--f-display);font-weight:700;font-size:1.7rem;margin:0;text-wrap:balance}
h1 small{font-family:var(--f-ui);font-weight:400;font-size:.9rem;color:var(--muted);margin-left:.6em}
h2{font-size:.78rem;letter-spacing:.12em;color:var(--muted);font-weight:500;margin:0 0 10px}
.settings{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;font-size:.88rem;color:var(--muted)}
.grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:860px){.grid{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:18px;min-width:0}
.panel+.panel{margin-top:20px}
label{display:flex;flex-direction:column;gap:4px;font-size:.82rem;color:var(--muted)}
input[type=text],select,textarea{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
textarea{font-size:.95rem;width:100%;resize:vertical}
input.char{font-family:var(--f-display);font-size:1.6rem;width:3.2em;text-align:center;padding:2px}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--zhu);outline-offset:2px}
button{font:inherit;font-size:.9rem;cursor:pointer;border-radius:6px;border:1px solid var(--line);background:var(--sheet);color:var(--ink);padding:7px 12px}
button:hover{border-color:var(--muted)}
button.primary{background:var(--zhu);border-color:var(--zhu);color:#fff;font-weight:500}
button:disabled{opacity:.45;cursor:not-allowed}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:6px 12px}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--sheet)}
.editor{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:520px){.editor{grid-template-columns:minmax(0,1fr)}}
.sources{display:flex;flex-direction:column;gap:14px}
.src{display:flex;gap:10px;align-items:center}
.src canvas{width:128px;height:128px;touch-action:none;cursor:crosshair;background:var(--paper);border:1px solid var(--line);border-radius:6px}
.src .ctl{display:flex;flex-direction:column;gap:6px}
input[type=range]{width:110px;accent-color:var(--zhu)}
.out{display:flex;flex-direction:column;align-items:center;gap:10px}
.out canvas{width:100%;max-width:260px;aspect-ratio:1;background:var(--paper);border:1px solid var(--line);border-radius:8px}
.ids{font-family:var(--f-mono);font-size:.95rem}
.chip{display:inline-flex;gap:6px;align-items:center;border-radius:999px;padding:3px 10px;font-size:.84rem}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.bad{background:var(--zhu-soft);color:var(--zhu)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.note{font-size:.82rem;color:var(--muted)}
.note a{color:var(--zhu)}
.cands{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px;margin-top:12px}
.cands button{padding:4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem;color:var(--muted)}
.cands canvas{width:52px;height:52px}
details summary{cursor:pointer;font-size:.85rem;color:var(--muted)}
.list-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:center;margin-bottom:12px}
.ratio{font-size:.86rem;font-variant-numeric:tabular-nums}
.ratio b{font-weight:500}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.item{position:relative;border:1px solid var(--line);border-radius:8px;padding:8px 6px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.74rem;background:var(--paper)}
.item canvas{width:64px;height:64px}
.item .id{font-family:var(--f-mono);font-weight:500;color:var(--ink)}
.item .meta{color:var(--muted);text-align:center}
.item .kind{position:absolute;top:5px;left:6px;font-size:.68rem;padding:0 5px;border-radius:4px}
.kind.real{background:var(--ok-soft);color:var(--ok)}
.kind.pseudo{background:var(--zhu-soft);color:var(--zhu)}
.item .del{position:absolute;top:2px;right:2px;border:0;background:none;padding:2px 6px;color:var(--muted)}
.item.flag{border-color:var(--zhu)}
.empty{border:1px dashed var(--line);border-radius:8px;padding:22px;text-align:center;color:var(--muted);font-size:.9rem}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center}
.tools input[type=range]{width:90px}
.tools button[aria-pressed=true]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
#cvOut{touch-action:none}
#cvOut.erasing{cursor:crosshair}
#cvOut.moving{cursor:move}
.seg.pre button{padding:3px 8px;font-size:.8rem}
.crop{display:grid;grid-template-columns:repeat(2,auto);gap:4px 8px}
.crop label{flex-direction:row;align-items:center;gap:4px}
.crop input{font:inherit;font-size:.85rem;width:4.2em;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:2px 4px}
.check{display:flex;flex-direction:row;align-items:center;gap:6px;font-size:.86rem;color:var(--ink)}
.status{min-height:1.4em;font-size:.86rem;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){button{transition:border-color .15s}}
</style>
<style>body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>繁體假字組字器<small>從兩個真字各裁一塊，拼成假字</small></h1>
    <div class="settings">
      <label style="flex-direction:row;align-items:center;gap:6px">字型
        <select id="font"><option value="sans">思源黑體 TC</option><option value="serif">思源宋體 TC</option></select></label>
      <label style="flex-direction:row;align-items:center;gap:6px">圖片尺寸
        <select id="size"><option>256</option><option selected>400</option><option>600</option></select></label>
      <label style="flex-direction:row;align-items:center;gap:6px">背景
        <select id="bg"><option value="white">白底</option><option value="clear">透明</option></select></label>
    </div>
  </header>

  <div class="grid">
    <div>
      <section class="panel" aria-labelledby="h-make">
        <h2 id="h-make">製作假字</h2>
        <div class="row" style="margin-bottom:14px">
          <div class="seg" role="group" aria-label="結構">
            <button id="st-lr" aria-pressed="true">⿰ 左右</button>
            <button id="st-tb" aria-pressed="false">⿱ 上下</button>
          </div>
          <span class="note" id="st-hint"></span>
        </div>
        <div class="editor">
          <div class="sources">
            <div class="src">
              <canvas id="cvA" width="256" height="256" aria-label="來源字 A：拖曳框的邊調整裁切範圍，拖曳框內移動整個框，在框外拖曳可畫新框"></canvas>
              <div class="ctl">
                <label>A 字<input id="inA" class="char" type="text" value="語" autocomplete="off"></label>
                <div class="seg pre" id="preA" role="group" aria-label="A 字取哪部分"><button data-pre="first">左半</button><button data-pre="second">右半</button><button data-pre="whole">整字</button></div>
                <div class="crop" role="group" aria-label="A 字裁切框（%）">
                  <label>左<input id="cropA-l" type="number" min="0" max="100" step="1"></label>
                  <label>右<input id="cropA-r" type="number" min="0" max="100" step="1"></label>
                  <label>上<input id="cropA-t" type="number" min="0" max="100" step="1"></label>
                  <label>下<input id="cropA-b" type="number" min="0" max="100" step="1"></label>
                </div>
              </div>
            </div>
            <div class="src">
              <canvas id="cvB" width="256" height="256" aria-label="來源字 B：拖曳框的邊調整裁切範圍，拖曳框內移動整個框，在框外拖曳可畫新框"></canvas>
              <div class="ctl">
                <label>B 字<input id="inB" class="char" type="text" value="湖" autocomplete="off"></label>
                <div class="seg pre" id="preB" role="group" aria-label="B 字取哪部分"><button data-pre="first">左半</button><button data-pre="second">右半</button><button data-pre="whole">整字</button></div>
                <div class="crop" role="group" aria-label="B 字裁切框（%）">
                  <label>左<input id="cropB-l" type="number" min="0" max="100" step="1"></label>
                  <label>右<input id="cropB-r" type="number" min="0" max="100" step="1"></label>
                  <label>上<input id="cropB-t" type="number" min="0" max="100" step="1"></label>
                  <label>下<input id="cropB-b" type="number" min="0" max="100" step="1"></label>
                </div>
              </div>
            </div>
            <button id="auto">自動找切線</button>
            <label class="check"><input id="cutStroke" type="checkbox" checked> 按筆畫切（整筆保留或丟掉）</label>
          </div>
          <div class="out">
            <canvas id="cvOut" width="520" height="520" tabindex="0" aria-label="組合結果：移動模式下拖曳部件，或用方向鍵微調（Shift 一次 10 格）"></canvas>
            <div id="cutWarn"></div>
            <div class="seg" role="group" aria-label="編輯模式">
              <button id="mMove" aria-pressed="true">移動部件</button>
              <button id="eraser" aria-pressed="false">橡皮擦</button>
            </div>
            <div class="tools" id="moveTools" role="group" aria-label="移動與縮放">
              <div class="seg" role="group" aria-label="選擇部件"><button id="selA" aria-pressed="true">部件 A</button><button id="selB" aria-pressed="false">部件 B</button></div>
              <label class="check" style="color:var(--muted)"><span id="sx-l">寬 100%</span><input id="sx" type="range" min="10" max="300" value="100"></label>
              <label class="check" style="color:var(--muted)"><span id="sy-l">高 100%</span><input id="sy" type="range" min="10" max="300" value="100"></label>
              <label class="check"><input id="lock" type="checkbox"> 鎖定長寬比</label>
              <button id="resetMove">此部件置中原大小</button>
              <button id="fitSize" title="把整個字等比例縮放、置中到參考框（真字的中位大小）">校正字的大小</button>
              <button id="calWeight" title="依目前的寬高比例換字重，讓兩個部件的筆畫粗細接近真字">校正筆畫粗細</button>
              <label class="check"><input id="showFrame" type="checkbox" checked> 顯示參考框</label>
              <div class="note" id="moveInfo" style="flex-basis:100%;text-align:center"></div>
            </div>
            <div class="tools" id="eraseTools" role="group" aria-label="橡皮擦" hidden>
              <label class="check" style="color:var(--muted)">粗細<input id="brush" type="range" min="4" max="40" value="12"></label>
              <button id="undoErase">復原</button>
              <button id="clearErase">清除擦除</button>
            </div>
            <button class="primary" id="addPseudo">加入清單（假字）</button>
          </div>
        </div>
        <p class="note" style="margin:14px 0 0">加入前請自行確認不是真字，可查<a href="https://dict.variants.moe.edu.tw/" target="_blank" rel="noopener">教育部異體字字典</a>並由母語者審核。</p>
      </section>

      <section class="panel" aria-labelledby="h-real">
        <h2 id="h-real">加入真字</h2>
        <div class="row">
          <input id="inReal" type="text" placeholder="可一次貼上多個字，例如：們說書" style="flex:1;min-width:180px">
          <button id="addReal">加入清單（真字）</button>
        </div>
        <p class="note" style="margin:8px 0 0">真字以同一字型、同一尺寸輸出，與假字風格一致，避免受試者從字型看出答案。</p>
      </section>
    </div>

    <section class="panel" aria-labelledby="h-list">
      <div class="list-head">
        <h2 id="h-list" style="margin:0">題目清單</h2>
        <div class="ratio" id="ratio"></div>
      </div>
      <div id="items"></div>
      <div class="row" style="margin-top:14px">
        <button class="primary" id="zip">下載全部（PNG ＋ CSV）</button>
        <button id="csv">只下載 CSV</button>
        <button id="clear">清空清單</button>
      </div>
      <div class="status" id="status" role="status" style="margin-top:8px"></div>
      <p class="note">清單只存在這個瀏覽器。CSV 欄位：題號、真／假、字、來源 A、來源 B、結構、切線、保留哪一半、裁切框、移動與縮放、切法、是否手動擦除、擦除紀錄、字型、圖檔名，以及排版方式、各部件位置與大小、各部件的擦除紀錄。</p>
    </section>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
(() => {
const $ = id => document.getElementById(id);
const FONTS = { sans: '"Noto Sans TC"', serif: '"Noto Serif TC"' };
// font weights available from Google Fonts for each family (variable fonts)
const WRANGE = { sans: [100, 900], serif: [200, 900] };
// Common characters used as a size and stroke reference when the list has fewer than 10 real characters.
const REF_CHARS = '的一是不了人我在有他這中大來上國個到說們為子和你地出道也時年';
const S = 400;
const NOMOVE = { dx: 0, dy: 0, sx: 1, sy: 1 };
// A part's place on the result (manual layout): out = (src - S/2) * s + S/2 + d, per axis, in 400 x 400 glyph pixels.
const NOPOS = { dx: 0, dy: 0, sx: 1, sy: 1 };
const KS = ['A', 'B'];
const state = {
  struct: 'lr', font: 'sans', items: [], seq: { P: 0, R: 0 }, erase: [], mode: 'move', sel: 'A',
  // editor: crop box per source, as [left, top, right, bottom] in % of the glyph; pre = which preset made it
  // pos = the part's place on the result (manual layout); erase = list of strokes, each { A?, B? } (one per part it touched)
  ed: { A: { crop: [0, 0, 50, 100], pre: 'first', pos: { ...NOPOS } }, B: { crop: [50, 0, 100, 100], pre: 'second', pos: { ...NOPOS } } },
};
let downloads = null;

// ---------- persistence (per-viewer convenience) ----------
const KEY = 'pseudo-char-maker-v1';
function save() { try { localStorage.setItem(KEY, JSON.stringify({ items: state.items, seq: state.seq, font: state.font })); } catch (e) {} }
function load() {
  try { const d = JSON.parse(localStorage.getItem(KEY) || 'null'); if (d) { state.items = d.items || []; state.seq = d.seq || state.seq; state.font = d.font || 'sans'; } } catch (e) {}
}

// ---------- glyph rendering ----------
const gcache = new Map();
function fam() { return FONTS[state.font]; }
// A glyph drawn before the web font has loaded uses a fallback font. Such a glyph is marked and not cached,
// so it is drawn again with the right font once the font is ready (otherwise it could end up in an export).
// w = font weight (400 = regular). The baseline is always measured at weight 400, so a heavier or lighter
// part stays in the same place.
function glyph(ch, w = 400) {
  const key = state.font + ch + (w === 400 ? '' : '@' + w); if (gcache.has(key)) return gcache.get(key);
  const c = document.createElement('canvas'); c.width = c.height = S;
  const x = c.getContext('2d', { willReadFrequently: true });
  let ready = true; try { ready = document.fonts.check(`400 64px ${fam()}`, ch + '永') && document.fonts.check(`${w} 64px ${fam()}`, ch); } catch (e) {}
  x.font = `400 ${Math.round(S * 0.86)}px ${fam()}, serif`;
  x.textAlign = 'center'; x.textBaseline = 'alphabetic'; x.fillStyle = '#000';
  const m = x.measureText('永');
  if (w !== 400) x.font = `${w} ${Math.round(S * 0.86)}px ${fam()}, serif`;
  x.fillText(ch, S / 2, S / 2 + (m.actualBoundingBoxAscent - m.actualBoundingBoxDescent) / 2);
  if (ready) gcache.set(key, c); else c.fallback = true;
  return c;
}
function inkProfile(c, vertical) {
  const d = c.getContext('2d', { willReadFrequently: true }).getImageData(0, 0, S, S).data, p = new Float64Array(S);
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) p[vertical ? y : x] += d[(y * S + x) * 4 + 3];
  return p;
}
// bounding box of the ink, [x0, y0, x1, y1] in pixels, or null when the canvas is empty
function inkBox(c) {
  const d = c.getContext('2d', { willReadFrequently: true }).getImageData(0, 0, S, S).data;
  let x0 = S, y0 = S, x1 = -1, y1 = -1;
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) if (d[(y * S + x) * 4 + 3]) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  return x1 < 0 ? null : [x0, y0, x1 + 1, y1 + 1];
}
function autoCut(ch) {
  const p = inkProfile(glyph(ch), state.struct === 'tb');
  let lo = Math.round(S * .28), hi = Math.round(S * .72), min = Infinity;
  for (let i = lo; i <= hi; i++) min = Math.min(min, p[i]);
  const tol = min + 255 * 2, cand = [];
  for (let i = lo; i <= hi; i++) if (p[i] <= tol) cand.push(i);
  return Math.round(cand[Math.floor(cand.length / 2)] / S * 100);
}

// ---------- crop boxes ----------
// A preset crop is one half of the glyph (cut along the structure's axis) or the whole glyph.
function presetCrop(struct, pre, cut) {
  if (pre === 'whole') return [0, 0, 100, 100];
  const lr = struct === 'lr';
  if (pre === 'first') return lr ? [0, 0, cut, 100] : [0, 0, 100, cut];
  return lr ? [cut, 0, 100, 100] : [0, cut, 100, 100];
}
// Items made before crop boxes existed store a cut and a kept side; they map to a half-glyph crop.
const sideOf = (it, k) => it[k] || (k === 'sideA' ? 'first' : 'second');
const cropOf = (it, k) => it['crop' + k] || presetCrop(it.struct, sideOf(it, 'side' + k), it['cut' + k]);
const moveOf = (it, k) => it['move' + k] || NOMOVE;
const posOf = (it, k) => it['pos' + k] || NOPOS;
const weightOf = (it, k) => it['weight' + k] || 400;
const isManual = it => it.layout === 'manual';
const isMoved = m => !!m && (m.dx !== 0 || m.dy !== 0 || m.sx !== 1 || m.sy !== 1);
// If a crop is a half glyph along the structure's axis, return { side, cut } (for the cut_* / keep_* CSV columns).
function halfOf(struct, c) {
  const [l, t, r, b] = c, lr = struct === 'lr';
  const [lo, hi, plo, phi] = lr ? [l, r, t, b] : [t, b, l, r];
  if (plo !== 0 || phi !== 100) return null;
  if (lo === 0 && hi < 100) return { side: 'first', cut: hi };
  if (hi === 100 && lo > 0) return { side: 'second', cut: lo };
  return null;
}
const isWhole = c => c[0] === 0 && c[1] === 0 && c[2] === 100 && c[3] === 100;

// Keep the part of a glyph inside a crop box.
// mode 'stroke': every connected group of ink is kept or dropped whole, by whether most of it lies inside the box;
// only a group that lies clearly on both sides (parts whose strokes touch) is cut along the box edge.
// mode 'line': plain straight cut along the box edges (items made before stroke cutting existed).
const kcache = new Map();

  $('cutStroke').checked = (it.cutMode || 'line') === 'stroke';

}
const pad = n => String(n).padStart(3, '0');
const hasErase = it => !!((it.erase && it.erase.length) || (it.eraseA && it.eraseA.length) || (it.eraseB && it.eraseB.length));
function addPseudo() {
  const it = cur(); if (!it.a || !it.b) return; it.id = 'P' + pad(++state.seq.P);
  state.items.push(it); save(); renderList(); status(`已加入 ${it.id}`);
}
function addReal() {

  ensureFont(chars.join('')).then(() => {
    for (const ch of chars) state.items.push({ kind: 'real', ch, id: 'R' + pad(++state.seq.R) });

}
function status(t) { $('status').textContent = t; }

// ---------- export ----------
function csvText() {
  const rows = [['item_id', 'lexicality', 'char', 'source_a', 'source_b', 'structure', 'cut_a', 'cut_b', 'keep_a', 'keep_b', 'crop_a', 'crop_b', 'move_a', 'move_b', 'cut_mode', 'manual_edit', 'erase_strokes', 'font', 'image', 'layout', 'place_a', 'place_b', 'erase_a', 'erase_b', 'weight_a', 'weight_b']];
  const fontName = state.font === 'sans' ? 'Noto Sans TC' : 'Noto Serif TC';
  const mv = m => JSON.stringify([m.dx, m.dy, m.sx, m.sy]);
  for (const it of state.items) {
    if (it.kind === 'real') { rows.push([it.id, 'real', it.ch, '', '', '', '', '', '', '', '', '', '', '', '', 'no', '', fontName, it.id + '.png', '', '', '', '', '', '', '']); continue; }
    const cA = cropOf(it, 'A'), cB = cropOf(it, 'B'), hA = halfOf(it.struct, cA), hB = halfOf(it.struct, cB), man = isManual(it);
    rows.push([it.id, 'pseudo', '', it.a, it.b, it.struct === 'lr' ? '⿰' : '⿱',
      hA ? hA.cut : '', hB ? hB.cut : '', hA ? SIDE_CSV[it.struct][hA.side] : '', hB ? SIDE_CSV[it.struct][hB.side] : '',
      JSON.stringify(cA), JSON.stringify(cB), man ? '' : mv(moveOf(it, 'A')), man ? '' : mv(moveOf(it, 'B')),
      it.cutMode || 'line', hasErase(it) ? 'yes' : 'no', it.erase && it.erase.length ? JSON.stringify(it.erase) : '', fontName, it.id + '.png',
      man ? 'manual' : 'auto', man ? mv(posOf(it, 'A')) : '', man ? mv(posOf(it, 'B')) : '',
      man && it.eraseA && it.eraseA.length ? JSON.stringify(it.eraseA) : '', man && it.eraseB && it.eraseB.length ? JSON.stringify(it.eraseB) : '',
      man ? weightOf(it, 'A') : '', man ? weightOf(it, 'B') : '']);
  }
  return '﻿' + rows.map(r => r.map(v => /[",\n]/.test(String(v)) ? `"${String(v).replace(/"/g, '""')}"` : v).join(',')).join('\n');
}
async function offer(filename, data) {
  try { await downloads.save({ filename, data }); status(`已下載 ${filename}`); }
  catch (e) { status(e && e.code === 'declined' ? '已取消下載' : '無法下載：' + (e && e.message || '未知錯誤')); }
}
async function doZip() {
  status('打包中…'); await ensureFont(state.items.map(i => i.kind === 'real' ? i.ch : i.a + i.b).join(''), itemWeights());
  const z = new JSZip();
  for (const it of state.items) { const b = await new Promise(r => exportCanvas(it).toBlob(r, 'image/png')); z.file(it.id + '.png', b); }
  z.file('items.csv', csvText());
  const blob = await z.generateAsync({ type: 'blob' });
  offer('pseudo-characters.zip', blob);
}

// ---------- fonts ----------
async function ensureFont(text, weights = [400]) {
  for (const w of new Set([400, ...weights])) {
    try { await document.fonts.load(`${w} 64px ${fam()}`, text + '永'); } catch (e) {} // 永 sets the baseline
  }
}
const itemWeights = () => state.items.flatMap(i => i.kind === 'pseudo' ? [weightOf(i, 'A'), weightOf(i, 'B')] : []).concat(KS.map(k => state.ed[k].weight || 400));
async function rerenderAll() {
  gcache.clear(); kcache.clear(); refCache.clear();
  await ensureFont($('inA').value + $('inB').value + state.items.map(i => i.kind === 'real' ? i.ch : i.a + i.b).join(''), itemWeights());
  refresh(); renderList(); prepareRef();
}

// ---------- size and stroke reference ----------
// Reference characters: the real characters in the list (when there are at least 10), otherwise REF_CHARS.
const refChars = () => { const r = [...new Set(state.items.filter(i => i.kind === 'real').map(i => i.ch))]; return r.length >= 10 ? r.join('') : REF_CHARS; };

function strokeWidth(c) {

function prepareRef() {

  const frame = [0, 1, 2, 3].map(i => median(boxes.map(b => b[i])));
  const base = [...chars].map(ch => strokeWidth(glyph(ch)));
  const table = ws.map(w => [w, [...chars].reduce((t, ch, i) => t + (base[i] ? strokeWidth(glyph(ch, w)) / base[i] : 1), 0) / chars.length]);

}

// stroke width of a part relative to a real character: weight factor x the average of width and height scale
function strokeRatio(w, pos) {
  const r = refNow(); if (!r) return null;
  const t = r.table; let f = w <= t[0][0] ? t[0][1] : t[t.length - 1][1];
  for (let i = 1; i < t.length; i++) if (w >= t[i - 1][0] && w <= t[i][0]) { const [w0, f0] = t[i - 1], [w1, f1] = t[i]; f = f0 + (f1 - f0) * (w - w0) / (w1 - w0); break; }

  await ensureFont($('inA').value + $('inB').value, Object.values(ws));
  for (const k in ws) state.ed[k].weight = ws[k];
  const lim = KS.filter(k => ch(k) && Math.abs(strokeRatio(ws[k], state.ed[k].pos) - 1) > 0.05);
  refresh();
  status(lim.length ? `部件 ${lim.join('、')} 縮放太多，字重已到上下限，筆畫無法完全校正。` : '已依目前的大小校正筆畫粗細。');

async function fitSize() {

// ---------- wire up ----------
load(); $('font').value = state.font;
$('st-lr').onclick = () => setStruct('lr'); $('st-tb').onclick = () => setStruct('tb');
// a new source character keeps both parts' places and all eraser strokes (only 復原 / 清除擦除 remove strokes)
KS.forEach(k => $('in' + k).addEventListener('input', async () => { await ensureFont($('inA').value + $('inB').value, KS.map(j => state.ed[j].weight || 400)); doAuto(); }));
$('auto').onclick = () => doAuto();
$('cutStroke').onchange = refresh;

// crop box: preset buttons, number fields, and dragging on the source glyph
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
const MINBOX = 5; // smallest crop box side, in %
for (const k of KS) {
  $('pre' + k).addEventListener('click', e => { const b = e.target.closest('button'); if (b) setPreset(k, b.dataset.pre); });
  ['l', 't', 'r', 'b'].forEach((s, i) => $(`crop${k}-${s}`).addEventListener('change', e => {
    const c = state.ed[k].crop.slice(), v = Math.round(+e.target.value);
    if (!Number.isFinite(v)) { refresh(); return; }
    c[i] = i < 2 ? clamp(v, 0, c[i + 2] - MINBOX) : clamp(v, c[i - 2] + MINBOX, 100);
    e.target.value = c[i]; setCrop(k, c, 'custom'); refresh();
  }));
  const cv = $('cv' + k); let drag = null;
  const pct = e => { const r = cv.getBoundingClientRect(); return [clamp((e.clientX - r.left) / r.width * 100, 0, 100), clamp((e.clientY - r.top) / r.height * 100, 0, 100)]; };

    const inY = py > c[1] - tol && py < c[3] + tol, inX = px > c[0] - tol && px < c[2] + tol;
    const ed = { l: inY && Math.abs(px - c[0]) < tol, r: inY && Math.abs(px - c[2]) < tol, t: inX && Math.abs(py - c[1]) < tol, b: inX && Math.abs(py - c[3]) < tol };
    if (ed.l && ed.r) (px < (c[0] + c[2]) / 2 ? ed.r = false : ed.l = false);
    if (ed.t && ed.b) (py < (c[1] + c[3]) / 2 ? ed.b = false : ed.t = false);
    const kind = ed.l || ed.r || ed.t || ed.b ? 'edges' : (px > c[0] && px < c[2] && py > c[1] && py < c[3]) ? 'move' : 'new';

      if (drag.ed.t) c[1] = R(clamp(py, 0, c[3] - MINBOX)); if (drag.ed.b) c[3] = R(clamp(py, c[1] + MINBOX, 100));

}

// output: move mode (drag a part, arrow keys) and eraser mode
const cvOut = $('cvOut'); let drawing = null, moving = null;

function setMode(m) {
  state.mode = m;
  $('mMove').setAttribute('aria-pressed', m === 'move'); $('eraser').setAttribute('aria-pressed', m === 'erase');
  cvOut.classList.toggle('moving', m === 'move'); cvOut.classList.toggle('erasing', m === 'erase');
  $('moveTools').hidden = m !== 'move'; $('eraseTools').hidden = m !== 'erase'; refresh();
}

}
// which part has ink under the point (the selected part wins where they overlap)
function partAt([px, py]) {

$('mMove').onclick = () => setMode('move');
$('eraser').onclick = () => setMode(state.mode === 'erase' ? 'move' : 'erase');

cvOut.addEventListener('pointerdown', e => {

    const others = compose(cur()).parts; drawing = { r: +$('brush').value / 2, p: [toS(e)], x: {}, others }; state.erase.push(drawing.x); drawStroke(); return;

  const k = state.sel, m = state.ed[k].pos, s = Math.round(v) / 100, c = ch(k);

$('sy').addEventListener('input', e => setScale('sy', +e.target.value));

$('resetMove').onclick = () => { state.ed[state.sel].pos = { ...NOPOS }; state.ed[state.sel].weight = 400; refresh(); };
$('calWeight').onclick = calibrateWeight;
$('fitSize').onclick = fitSize;
$('showFrame').onchange = refresh;
$('undoErase').onclick = () => { state.erase.pop(); refresh(); };
$('clearErase').onclick = () => { state.erase = []; refresh(); };
$('addPseudo').onclick = addPseudo;
$('addReal').onclick = addReal;
$('inReal').addEventListener('keydown', e => { if (e.key === 'Enter') addReal(); });
$('font').onchange = () => { state.font = $('font').value; save(); rerenderAll(); };
$('clear').onclick = () => {
  if ($('clear').dataset.armed) { state.items = []; state.seq = { P: 0, R: 0 }; save(); renderList(); status('清單已清空'); delete $('clear').dataset.armed; $('clear').textContent = '清空清單'; }
  else { $('clear').dataset.armed = 1; $('clear').textContent = '再按一次確認清空'; setTimeout(() => { delete $('clear').dataset.armed; $('clear').textContent = '清空清單'; }, 3000); }
};
$('csv').onclick = () => offer('items.csv', csvText());
$('zip').onclick = doZip;

setMode('move'); renderList(); rerenderAll().then(() => doAuto());

  downloads = { save: async ({ filename, data }) => {
    const blob = data instanceof Blob ? data : new Blob([data], { type: filename.endsWith('.csv') ? 'text/csv' : 'application/octet-stream' });

})();
